<!DOCTYPE html>
<html lang="gu" data-lang="gu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>કોન બનેગા નિષ્ઠાવાન · Kon Banega Nisthavan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --f-serif:"Fraunces",Georgia,serif;
  --f-guj:"Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,sans-serif;
  --f-sans:"Inter",system-ui,sans-serif;
  --bg:#f6f1ea; --bg-alt:#ede4d7; --ink:#1d1a1a; --ink-soft:#4a4340; --muted:#8a7e77;
  --rose:#b8456b; --rose-deep:#7e2a48; --gold:#b8936a; --green:#4f6a3a;
  --card:#fffaf3; --hair:#d9cfc0; --cream:#fff4dc;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  min-height:100vh;font-family:var(--f-guj);color:var(--ink);background:var(--bg);
  line-height:1.7;font-size:17px;-webkit-font-smoothing:antialiased;
}
html[data-lang="en"] body{font-family:var(--f-sans);}
img{display:block;max-width:100%;height:auto;}
a{color:inherit;}

/* nav */
.nav{
  position:sticky;top:0;z-index:50;background:rgba(246,241,234,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(217,207,192,.8);padding:12px 26px;display:flex;
  align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;line-height:1.15;}
.brand strong{color:var(--rose-deep);font-size:1rem;font-weight:800;}
.brand span{color:var(--muted);font-family:var(--f-sans);font-size:.64rem;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;}
.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nav-pills{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;}
.nav-pill{
  text-decoration:none;color:var(--rose-deep);border:1px solid rgba(184,69,107,.34);
  background:rgba(255,250,243,.66);border-radius:999px;padding:5px 11px;font-weight:800;font-size:.92rem;
  transition:transform .2s,background .2s,color .2s,border-color .2s;
}
.nav-pill:hover{transform:translateY(-1px);background:var(--rose);border-color:var(--rose);color:var(--cream);}

/* language toggle */
.lang-toggle{
  display:inline-flex;align-items:center;gap:0;background:var(--card);border:1px solid var(--hair);
  border-radius:999px;padding:3px;font-family:var(--f-sans);font-weight:800;font-size:.78rem;
  box-shadow:0 4px 12px -8px rgba(30,20,20,.2);
}
.lang-toggle button{
  cursor:pointer;background:transparent;border:0;padding:6px 14px;border-radius:999px;
  font:inherit;color:var(--muted);letter-spacing:.08em;transition:all .2s;
}
.lang-toggle button.active{background:var(--rose);color:var(--cream);}
.lang-toggle button:not(.active):hover{color:var(--rose-deep);}

/* hero */
.hero{padding:46px 24px 34px;background:
  radial-gradient(900px 420px at 50% -20%,rgba(184,69,107,.16),transparent 64%),
  linear-gradient(180deg,#f6f1ea 0%,#fffaf3 100%);}
.hero-inner{max-width:1120px;margin:0 auto;}
.eyebrow{font-family:var(--f-sans);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:12px;}
h1{font-family:var(--f-serif);font-weight:300;font-size:clamp(2.6rem,6vw,5rem);line-height:1;color:var(--ink);}
h1 em{color:var(--rose);font-style:italic;}
.hero-copy{margin-top:18px;max-width:780px;color:var(--ink-soft);font-size:clamp(1rem,1.5vw,1.14rem);}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
.mini-stat{min-width:120px;padding:10px 14px;background:rgba(255,250,243,.72);
  border:1px solid var(--hair);border-radius:6px;}
.mini-stat strong{display:block;font-family:var(--f-serif);font-size:1.5rem;color:var(--rose-deep);line-height:1;}
.mini-stat span{display:block;margin-top:5px;font-family:var(--f-sans);font-size:.64rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}

/* bands */
.band{padding:44px 24px;}
.band:nth-of-type(even){background:var(--bg-alt);}
.wrap{max-width:1120px;margin:0 auto;}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.sec-num{font-family:var(--f-sans);font-weight:800;font-size:.78rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--rose);}
.section-head h2{font-family:var(--f-serif);font-weight:300;font-size:clamp(1.9rem,3.4vw,2.7rem);line-height:1.1;}
.section-head h2 em{color:var(--rose);font-style:italic;}

.question-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.question-card{background:var(--card);border:1px solid var(--hair);border-radius:8px;
  box-shadow:0 18px 45px -30px rgba(30,20,20,.36);padding:18px 20px;}
.q-top{display:flex;gap:11px;align-items:flex-start;}
.q-number{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:#f1e4d4;color:var(--rose-deep);font-family:var(--f-serif);font-size:1.05rem;}
.q-main{flex:1;}
.question{font-weight:800;color:var(--ink);font-size:1.02rem;}
.options{display:grid;gap:7px;margin:14px 0 0 45px;}
.option{border:1px solid rgba(217,207,192,.9);background:rgba(255,255,255,.5);border-radius:6px;
  padding:7px 10px;color:var(--ink-soft);font-weight:600;font-size:.98rem;}
.option.correct{color:#164d36;border-color:rgba(79,106,58,.45);background:#eaf2df;}
.option-label{font-family:var(--f-sans);font-weight:800;margin-right:6px;color:var(--muted);}
.option.correct .option-label{color:var(--green);}
details{margin:13px 0 0 45px;border-top:1px solid rgba(217,207,192,.8);padding-top:11px;}
summary{cursor:pointer;color:var(--rose-deep);font-weight:800;list-style:none;font-size:.95rem;}
summary::-webkit-details-marker{display:none;}
summary::after{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;
  margin-left:8px;border-radius:50%;border:1px solid rgba(184,69,107,.4);font-family:var(--f-sans);}
details[open] summary::after{content:"\2013";}
.prasang{margin-top:10px;color:var(--ink-soft);font-size:.99rem;}
.prasang p+p{margin-top:9px;}

/* games */
.games-head{margin:34px 0 16px;font-family:var(--f-sans);font-weight:800;font-size:.82rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--rose);
  border-top:1px solid var(--hair);padding-top:18px;}
.game-panel{background:var(--card);border:1px solid var(--hair);border-radius:8px;
  box-shadow:0 18px 45px -30px rgba(30,20,20,.36);padding:20px 24px;margin-bottom:16px;}
.game-name{font-family:var(--f-serif);font-weight:350;font-size:clamp(1.4rem,2.4vw,1.95rem);
  color:var(--rose-deep);margin-bottom:6px;}
.game-tag{font-family:var(--f-sans);font-size:.7rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.game-image{display:block;max-width:100%;width:auto;height:auto;
  max-height:min(620px,72vh);object-fit:contain;
  border-radius:8px;margin:6px auto 20px;
  box-shadow:0 14px 36px -22px rgba(30,20,20,.35);}
@media(max-width:880px){
  .game-image{max-height:min(480px,60vh);}
}
@media(max-width:640px){
  .game-image{max-height:60vh;margin:4px auto 14px;}
}
.game-block h4{color:var(--rose-deep);font-family:var(--f-sans);font-size:.92rem;font-weight:800;
  margin:13px 0 4px;}
.game-block ul,.game-block ol{margin-left:1.3rem;color:var(--ink-soft);line-height:1.5;font-size:.97rem;
  font-family:var(--f-sans);}
.game-block li+li{margin-top:2px;}

footer{padding:30px 24px 50px;text-align:center;color:var(--muted);font-family:var(--f-sans);
  font-size:.8rem;}

@media(max-width:880px){
  .question-grid{grid-template-columns:1fr;}
}
@media(max-width:640px){
  body{font-size:16px;}
  .nav{flex-direction:column;align-items:flex-start;}
  .options,details{margin-left:0;}
  .q-top{flex-direction:column;}
}
</style>
</head>

<nav class="nav">
  <div class="brand">

<main id="main"></main>

<footer>

</footer>

/* =====================================================
   STATE + RENDER
   ===================================================== */
const LETTERS = ["A","B","C","D","E","F"];
let LANG = "gu";

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function applyChrome(){
  const t = UI[LANG];
  document.documentElement.setAttribute("data-lang", LANG);
  document.documentElement.lang = (LANG === "gu" ? "gu" : "en");
  document.querySelector("[data-i18n-brand]").textContent = t.brand;
  document.querySelector("[data-i18n-tag]").textContent = t.tag;
  document.querySelector("[data-i18n-eyebrow]").textContent = t.eyebrow;
  document.querySelector("[data-i18n-h1]").innerHTML = t.h1;
  document.querySelector("[data-i18n-lead]").textContent = t.lead;
  document.querySelector("[data-i18n-stat-sec]").textContent = t.statSec;
  document.querySelector("[data-i18n-stat-q]").textContent = t.statQ;
  document.querySelector("[data-i18n-stat-g]").textContent = t.statG;
  document.querySelector("[data-i18n-footer]").textContent = t.footer;
  document.querySelectorAll("[data-lang-btn]").forEach(b=>{
    const active = b.dataset.langBtn === LANG;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", active ? "true" : "false");
  });
}

function renderQuestion(item, idx){
  const t = UI[LANG];
  const card = el("div","question-card");
  const top = el("div","q-top");
  top.appendChild(el("div","q-number", String(idx)));
  const main = el("div","q-main");
  main.appendChild(el("div","question", item.q[LANG]));
  top.appendChild(main);
  card.appendChild(top);

  if(item.options && item.options[LANG] && item.options[LANG].length){
    const opts = el("div","options");
    item.options[LANG].forEach((o,i)=>{
      const isCorrect = i === item.correct;
      const op = el("div","option" + (isCorrect ? " correct" : ""));
      op.innerHTML = '<span class="option-label">'+LETTERS[i]+'</span>'+o;
      opts.appendChild(op);
    });
    card.appendChild(opts);
  }
  if(item.prasang && item.prasang[LANG] && item.prasang[LANG].length){
    const d = el("details");
    d.appendChild(el("summary",null, t.pradsangLbl));
    const body = el("div","prasang");
    item.prasang[LANG].forEach(p=> body.appendChild(el("p",null,p)));
    d.appendChild(body);
    card.appendChild(d);
  }
  return card;
}

function renderGames(games, image){
  // Group entries: a "title-only" entry (no items) starts a new panel
  const panels = [];
  let cur = null;
  games.forEach(entry=>{
    if(!entry.items){
      if(cur) panels.push(cur);
      cur = { name: entry.title, blocks: [] };
    } else {
      if(!cur) cur = { name:"", blocks:[] };
      cur.blocks.push(entry);
    }
  });
  if(cur) panels.push(cur);

  const frag = document.createDocumentFragment();
  panels.forEach((p, pi)=>{
    const panel = el("div","game-panel");
    if(p.name) panel.appendChild(el("div","game-name", p.name));
    panel.appendChild(el("div","game-tag", "Activity instructions (English)"));
    if(image && pi === 0){
      const img = el("img","game-image");
      img.src = image;
      img.alt = p.name || "activity";
      img.loading = "lazy";
      panel.appendChild(img);
    }
    p.blocks.forEach(b=>{
      const block = el("div","game-block");
      block.appendChild(el("h4",null,b.title));
      const list = el(b.ordered ? "ol" : "ul");
      b.items.forEach(it=> list.appendChild(el("li",null,it)));
      block.appendChild(list);
      panel.appendChild(block);
    });
    frag.appendChild(panel);
  });
  return frag;
}

function render(){
  applyChrome();
  const t = UI[LANG];
  const main = document.getElementById("main");
  const nav = document.getElementById("navPills");
  main.innerHTML = "";
  nav.innerHTML = "";

  let totalQ = 0, totalG = 0;

  SECTIONS.forEach((sec, sIdx)=>{
    // nav pill
    const pill = el("a","nav-pill", (sIdx+1) + ". " + sec.title[LANG]);
    pill.href = "#sec-" + sec.key;
    nav.appendChild(pill);

    const band = el("section","band");
    band.id = "sec-" + sec.key;
    const wrap = el("div","wrap");

    const head = el("div","section-head");
    head.appendChild(el("span","sec-num", t.secLabel + " " + (sIdx+1)));
    head.appendChild(el("h2",null, sec.title[LANG]));
    wrap.appendChild(head);

    const grid = el("div","question-grid");
    sec.questions.forEach((q,i)=>{
      totalQ++;
      grid.appendChild(renderQuestion(q, i+1));
    });
    wrap.appendChild(grid);

    if(sec.games && sec.games.length){
      const titles = sec.games.filter(g=>!g.items).length || 1;
      totalG += titles;
      wrap.appendChild(el("div","games-head", t.gamesHead + " (" + titles + ")"));
      wrap.appendChild(renderGames(sec.games, sec.image));
    }

    band.appendChild(wrap);
    main.appendChild(band);
  });

  document.getElementById("statSec").textContent = SECTIONS.length;
  document.getElementById("statQ").textContent = totalQ;
  document.getElementById("statG").textContent = totalG;
}

document.querySelectorAll("[data-lang-btn]").forEach(b=>{
  b.addEventListener("click", ()=>{
    const next = b.dataset.langBtn;
    if(next === LANG) return;
    LANG = next;
    render();
  });
});

render();
</script>
